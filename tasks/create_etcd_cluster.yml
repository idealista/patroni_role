---

- name: etcd cluster - Include main variables
  ansible.builtin.include_vars: "vars/main.yml"
  tags: always
- name: etcd cluster - Include system variables
  ansible.builtin.include_vars: "vars/system.yml"
  tags: always
- name: etcd cluster - Include OS-specific variables
  ansible.builtin.include_vars: "vars/{{ ansible_os_family }}.yml"
  tags: always


- name: etcd cluster - Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_status
  until: apt_status is success
  delay: 5
  retries: 3
  environment: "{{ proxy_env | default({}) }}"
  when: ansible_os_family == "Debian" and installation_method == "repo"

- name: etcd cluster - Make sure the gnupg and apt-transport-https packages are present
  ansible.builtin.apt:
    pkg:
      - gnupg
      - apt-transport-https
    state: present
  register: apt_status
  until: apt_status is success
  delay: 5
  retries: 3
  environment: "{{ proxy_env | default({}) }}"
  when: ansible_os_family == "Debian" and installation_method == "repo"

- import_tasks: hostname.yml
  tags: patroni, patroni_install, pip, etcd, hostname

- import_tasks: etcd.yml
  tags: patroni, patroni_install, pip, etcd
